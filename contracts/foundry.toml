[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
verbosity = 2
bytecode_hash = "none"
cbor_metadata = false
sparse_mode = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# Match packing / gas claims in README and interviews
gas_reports = ["Market", "LendingPool", "InterestRateModel", "CollateralManager"]

[profile.default.fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"

# Everyday fuzz — keep local runs snappy
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536
seed = "0x68656c6978000000000000000000000000000000000000000000000000000001"
include_storage = true
include_push_bytes = true

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false
call_override = false

# CI: more coverage than default, still finishes in minutes
[profile.ci]
ffi = false
verbosity = 3

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 128
depth = 128

# Nightly / pre-Phase-2 gate: the suite the spec actually cares about
[profile.intense]
ffi = false

[profile.intense.fuzz]
runs = 10000

[profile.intense.invariant]
runs = 512
depth = 500
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }